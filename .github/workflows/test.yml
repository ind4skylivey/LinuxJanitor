name: Tests

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          chmod +x scripts/run-tests.sh
          ./scripts/run-tests.sh
